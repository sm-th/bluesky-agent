#:schema https://secretspec.dev/schema/secretspec.schema.json
# This manifest declares secret names only. It never contains secret values.
[project]
name = "bluesky-agent"
revision = "1.0"

[profiles.default]
BLUESKY_AGENT_APP_PASSWORD = { description = "App password for the Agent's Bluesky account", required = true }
BLUESKY_AGENT_GITHUB_TOKEN = { description = "GitHub token allowed to push the Research Wiki", required = true }

# Configure BLUESKY_AGENT_OMP_MODEL for one of these model providers and supply
# at least the matching key. Unused provider keys should remain absent.
ANTHROPIC_API_KEY = { description = "Anthropic model provider API key", required = { at_least_one = "model_provider" } }
OPENAI_API_KEY = { description = "OpenAI model provider API key", required = { at_least_one = "model_provider" } }
OPENAI_BASE_URL   = { description = "Optional OpenAI-compatible provider endpoint", required = false }
GEMINI_API_KEY = { description = "Google Gemini model provider API key", required = { at_least_one = "model_provider" } }
OPENROUTER_API_KEY = { description = "OpenRouter model provider API key", required = { at_least_one = "model_provider" } }

# OMP has credential-free search fallbacks. Set only the preferred keyed search
# provider, if one is required for the deployment.
EXA_API_KEY = { description = "Exa search provider API key", required = false }
BRAVE_API_KEY = { description = "Brave Search API key", required = false }
TAVILY_API_KEY = { description = "Tavily search provider API key", required = false }
